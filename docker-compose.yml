services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      RELAY_DATABASE_PATH: /app/data/relay.db
    volumes:
      - relay-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  relay-data:
